<!doctype html>
<html>
<head>
  <meta charset="utf-8">

<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    * { box-sizing: border-box; }
    @keyframes vpPulse { 0%,100% { opacity:.55; transform:scale(1); } 50% { opacity:1; transform:scale(1.06); } }

  </style>
</helmet>
<div style="width:1000px;height:680px;background:#161618;font-family:-apple-system,'SF Pro Text','Helvetica Neue',system-ui,sans-serif;color:#F2F2F7;display:flex;flex-direction:column;overflow:hidden;border-radius:12px;">

      <div style="width:12px;height:12px;border-radius:50%;background:#28C840;"></div>
    </div>
    <div style="font-weight:700;font-size:16px;letter-spacing:-0.2px;margin-left:6px;">VibePal</div>
    <div style="display:flex;align-items:center;gap:8px;height:30px;padding:0 12px;background:#2C2C2E;border:1px solid #3A3A3C;border-radius:8px;font-size:13px;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#98989D" stroke-width="1.8"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>

    </div>
    <div style="flex:1;"></div>
    <div style="display:flex;align-items:center;gap:6px;font-size:13px;color:#E5E5EA;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#98989D" stroke-width="1.8"><path d="M4 12a8 8 0 0 1 8-8"/><path d="M20 12a8 8 0 0 1-8 8"/><circle cx="12" cy="12" r="2.4" fill="#98989D" stroke="none"/></svg>
      已连接

    </div>
    <div style="display:flex;align-items:center;gap:6px;font-size:13px;color:#C7C7CC;margin-left:6px;">

    </button>
  </div>

  <!-- Body -->

      <svg width="188" height="424" viewBox="0 0 188 424" fill="none" xmlns="http://www.w3.org/2000/svg" style="position:relative;">
        <defs>
          <linearGradient id="aluD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3A3A3C"/><stop offset="0.55" stop-color="#2A2A2C"/><stop offset="1" stop-color="#202022"/></linearGradient>
          <radialGradient id="knobG" cx="0.4" cy="0.34" r="0.85"><stop offset="0" stop-color="#7CF29B"/><stop offset="0.55" stop-color="#30D158"/><stop offset="1" stop-color="#1E9E43"/></radialGradient>
          <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>
        <rect x="28" y="6" width="132" height="412" rx="30" fill="url(#aluD)" stroke="#0E0E10" stroke-width="1"/>
        <g stroke="#4A4A4C" stroke-width="3" stroke-linecap="round"><line x1="70" y1="30" x2="70" y2="52"/><line x1="80" y1="26" x2="80" y2="56"/><line x1="90" y1="24" x2="90" y2="58"/><line x1="100" y1="26" x2="100" y2="56"/><line x1="110" y1="30" x2="110" y2="52"/></g>
        <text x="94" y="82" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="12" font-weight="600" fill="#6E6E73" letter-spacing="0.5">VibePal</text>
        <!-- glowing dial -->
        <circle cx="94" cy="158" r="56" fill="url(#knobG)" filter="url(#glow)"/>
        <circle cx="94" cy="158" r="56" fill="none" stroke="#7CF29B" stroke-width="1.5" opacity="0.7"/>
        <circle cx="94" cy="158" r="20" fill="#189A3E"/>
        <rect x="158" y="150" width="9" height="34" rx="4.5" fill="#38383A" stroke="#141416"/>
        <circle cx="94" cy="256" r="27" fill="#2A2A2C" stroke="#0E0E10" stroke-width="1.4"/>
        <g stroke="#B9BABE" stroke-width="1.9" fill="none" stroke-linecap="round"><rect x="90" y="245" width="8" height="12" rx="4"/><path d="M85 254a9 9 0 0 0 18 0"/><line x1="94" y1="263" x2="94" y2="268"/></g>
        <circle cx="94" cy="322" r="27" fill="#2A2A2C" stroke="#0E0E10" stroke-width="1.4"/>
        <path d="M84 322l7 7 13-14" stroke="#B9BABE" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="94" cy="388" r="27" fill="#2A2A2C" stroke="#0E0E10" stroke-width="1.4"/>
        <path d="M86 380l16 16M102 380l-16 16" stroke="#B9BABE" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
    </div>

    <!-- Right: status -->
    <div style="flex:1;padding:26px 30px;display:flex;flex-direction:column;gap:18px;">
      <div style="font-size:13px;font-weight:600;color:#8E8E93;letter-spacing:0.4px;text-transform:uppercase;">实时状态</div>

      <!-- Active state card -->
      <div style="background:#1F241F;border:1px solid #2E3A2F;border-radius:16px;padding:22px 24px;">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
          <div style="width:36px;height:36px;border-radius:9px;background:#0A0A0A;display:flex;align-items:center;justify-content:center;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="#D97757"><path d="M12 2l2.4 6.9L21 11l-6.6 2.1L12 20l-2.4-6.9L3 11l6.6-2.1z"/></svg>
          </div>
          <div>
            <div style="font-size:15px;font-weight:600;">Claude Code</div>
            <div style="font-size:12px;color:#8E8E93;">会话 · mako-home-network</div>
          </div>
          <div style="flex:1;"></div>
          <div style="font-size:12px;color:#8E8E93;font-variant-numeric:tabular-nums;">已运行 4:12</div>
        </div>
        <div style="display:flex;align-items:baseline;gap:12px;">
          <span style="width:12px;height:12px;border-radius:50%;background:#30D158;box-shadow:0 0 12px rgba(48,209,88,0.7);align-self:center;"></span>
          <div style="font-size:34px;font-weight:700;letter-spacing:-0.5px;">工作中</div>
          <div style="flex:1;"></div>
          <div style="font-size:13px;color:#30D158;font-weight:600;background:rgba(48,209,88,0.12);border-radius:8px;padding:5px 10px;">working</div>
        </div>
        <div style="margin-top:12px;font-size:14px;color:#C7C7CC;display:flex;align-items:center;gap:8px;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="1.8"><path d="M4 17l6-6-6-6"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
          正在运行 <span style="color:#F2F2F7;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;">cargo build --release</span>
        </div>
      </div>

      <!-- State legend -->
      <div>
        <div style="font-size:12px;color:#8E8E93;margin-bottom:10px;">状态灯效</div>
        <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;">

          <div style="display:flex;align-items:center;gap:9px;padding:11px 13px;background:#242426;border:1px solid #313133;border-radius:11px;"><span style="width:11px;height:11px;border-radius:50%;background:#FF453A;"></span><span style="font-size:13px;color:#C7C7CC;">出错 error</span></div>
          <div style="display:flex;align-items:center;gap:9px;padding:11px 13px;background:#242426;border:1px solid #313133;border-radius:11px;"><span style="width:11px;height:11px;border-radius:50%;background:#FF9F0A;"></span><span style="font-size:13px;color:#C7C7CC;">待确认 attention</span></div>
          <div style="display:flex;align-items:center;gap:9px;padding:11px 13px;background:#242426;border:1px solid #313133;border-radius:11px;"><span style="width:11px;height:11px;border-radius:50%;background:#64D2FF;"></span><span style="font-size:13px;color:#C7C7CC;">通知 notification</span></div>
        </div>
      </div>

      <!-- Recent log -->
      <div style="flex:1;min-height:0;">
        <div style="font-size:12px;color:#8E8E93;margin-bottom:8px;">最近</div>
        <div style="display:flex;flex-direction:column;gap:2px;font-size:12.5px;color:#98989D;font-variant-numeric:tabular-nums;">
          <div style="display:flex;gap:10px;"><span style="color:#636366;">14:22:07</span><span style="color:#30D158;">●</span><span>PreToolUse · Bash → 工作中</span></div>
          <div style="display:flex;gap:10px;"><span style="color:#636366;">14:21:55</span><span style="color:#BF5AF2;">●</span><span>UserPromptSubmit → 思考</span></div>
          <div style="display:flex;gap:10px;"><span style="color:#636366;">14:19:03</span><span style="color:#FF9F0A;">●</span><span>Stop → 待确认</span></div>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
