<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    * { box-sizing: border-box; }
    .vp-row { transition: background .12s ease; }
  </style>
</helmet>
<div style="width:1000px;height:680px;background:#ECECEE;font-family:-apple-system,'SF Pro Text','Helvetica Neue',system-ui,sans-serif;color:#1D1D1F;display:flex;flex-direction:column;overflow:hidden;border-radius:12px;">

  <!-- Title bar -->
  <div style="height:52px;display:flex;align-items:center;gap:14px;padding:0 18px;background:#F6F6F7;border-bottom:1px solid #DCDCDE;">
    <div style="display:flex;gap:8px;align-items:center;">
      <div style="width:12px;height:12px;border-radius:50%;background:#FF5F57;"></div>
      <div style="width:12px;height:12px;border-radius:50%;background:#FEBC2E;"></div>
      <div style="width:12px;height:12px;border-radius:50%;background:#28C840;"></div>
    </div>
    <div style="font-weight:700;font-size:16px;letter-spacing:-0.2px;margin-left:6px;">VibePal</div>
    <div style="display:flex;align-items:center;gap:8px;height:30px;padding:0 12px;background:#FFFFFF;border:1px solid #E0E0E2;border-radius:8px;font-size:13px;color:#1D1D1F;box-shadow:0 1px 1px rgba(0,0,0,0.03);">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6E6E73" stroke-width="1.8"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      日常工作
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
    </div>
    <div style="flex:1;"></div>
    <div style="display:flex;align-items:center;gap:6px;font-size:13px;color:#1D1D1F;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6E6E73" stroke-width="1.8"><path d="M4 12a8 8 0 0 1 8-8"/><path d="M20 12a8 8 0 0 1-8 8"/><circle cx="12" cy="12" r="2.4" fill="#6E6E73" stroke="none"/></svg>
      已连接
      <span style="width:7px;height:7px;border-radius:50%;background:#28C840;margin-left:2px;box-shadow:0 0 0 3px rgba(40,200,64,0.18);"></span>
    </div>
    <div style="display:flex;align-items:center;gap:6px;font-size:13px;color:#3A3A3C;margin-left:6px;">
      <svg width="26" height="16" viewBox="0 0 30 16" fill="none"><rect x="1" y="2.5" width="24" height="11" rx="3" stroke="#8E8E93" stroke-width="1.4"/><rect x="3" y="4.5" width="18" height="7" rx="1.5" fill="#28C840"/><rect x="26.5" y="6" width="2.4" height="4" rx="1.2" fill="#8E8E93"/></svg>
      85%
    </div>
    <button style="width:30px;height:30px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;border-radius:7px;cursor:pointer;margin-left:2px;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#6E6E73" stroke-width="1.7"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.6 1.6 0 0 0 .32 1.77l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.6 1.6 0 0 0-2.7 1.15V21a2 2 0 1 1-4 0v-.09A1.6 1.6 0 0 0 6.6 19.4a1.6 1.6 0 0 0-1.77.32l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.6 1.6 0 0 0 3.15 14 1.6 1.6 0 0 0 2 12.6H2a2 2 0 1 1 0-4h.09A1.6 1.6 0 0 0 3.6 6.6a1.6 1.6 0 0 0-.32-1.77l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.6 1.6 0 0 0 8 3.15 1.6 1.6 0 0 0 9 2h.09a2 2 0 1 1 4 0V2a1.6 1.6 0 0 0 1 1.15 1.6 1.6 0 0 0 1.77-.32l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.6 1.6 0 0 0 21 8.09V8a2 2 0 1 1 0 4h-.09a1.6 1.6 0 0 0-1.51 1z"/></svg>
    </button>
  </div>

  <!-- Body -->
  <div style="flex:1;display:flex;min-height:0;">

    <!-- Left: device -->
    <div style="width:352px;display:flex;align-items:center;justify-content:center;background:#F1F1F3;border-right:1px solid #E2E2E4;">
      <svg width="188" height="424" viewBox="0 0 188 424" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="alu" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FDFDFE"/><stop offset="0.55" stop-color="#E9EAEC"/><stop offset="1" stop-color="#D4D5D9"/></linearGradient>
          <radialGradient id="knob" cx="0.38" cy="0.32" r="0.85"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E3E4E8"/></radialGradient>
          <filter id="ds" x="-20%" y="-10%" width="140%" height="120%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.12"/></filter>
        </defs>
        <rect x="28" y="6" width="132" height="412" rx="30" fill="url(#alu)" stroke="#C9CACD" stroke-width="1" filter="url(#ds)"/>
        <!-- mic grille -->
        <g stroke="#B6B7BB" stroke-width="3" stroke-linecap="round">
          <line x1="70" y1="30" x2="70" y2="52"/><line x1="80" y1="26" x2="80" y2="56"/><line x1="90" y1="24" x2="90" y2="58"/><line x1="100" y1="26" x2="100" y2="56"/><line x1="110" y1="30" x2="110" y2="52"/>
        </g>
        <text x="94" y="82" text-anchor="middle" font-family="-apple-system,sans-serif" font-size="12" font-weight="600" fill="#8C8D91" letter-spacing="0.5">VibePal</text>
        <!-- dial -->
        <circle cx="94" cy="158" r="56" fill="url(#knob)" stroke="#CFD0D4" stroke-width="1.5"/>
        <g stroke="#B9BABE" stroke-width="2.5" stroke-linecap="round"><line x1="94" y1="112" x2="94" y2="122"/><line x1="94" y1="194" x2="94" y2="204"/><line x1="48" y1="158" x2="58" y2="158"/><line x1="130" y1="158" x2="140" y2="158"/></g>
        <circle cx="94" cy="158" r="20" fill="#EDEEF0" stroke="#DCDDE0"/>
        <!-- side button -->
        <rect x="158" y="150" width="9" height="34" rx="4.5" fill="#DBDCDF" stroke="#C6C7CB"/>
        <!-- buttons -->
        <circle cx="94" cy="256" r="27" fill="#FFFFFF" stroke="#E2E3E6" stroke-width="1.4"/>
        <g stroke="#7C7D82" stroke-width="1.9" fill="none" stroke-linecap="round"><rect x="90" y="245" width="8" height="12" rx="4"/><path d="M85 254a9 9 0 0 0 18 0"/><line x1="94" y1="263" x2="94" y2="268"/></g>
        <circle cx="94" cy="322" r="27" fill="#FFFFFF" stroke="#E2E3E6" stroke-width="1.4"/>
        <path d="M84 322l7 7 13-14" stroke="#7C7D82" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="94" cy="388" r="27" fill="#FFFFFF" stroke="#E2E3E6" stroke-width="1.4"/>
        <path d="M86 380l16 16M102 380l-16 16" stroke="#7C7D82" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
    </div>

    <!-- Right: mapping -->
    <div style="flex:1;padding:26px 30px;overflow:auto;background:#FFFFFF;">
      <div style="font-size:22px;font-weight:700;letter-spacing:-0.3px;margin:0 0 18px;">控制映射</div>

      <div style="display:flex;flex-direction:column;gap:12px;">

        <!-- 旋钮 -->
        <div class="vp-row" style="display:flex;align-items:center;gap:14px;padding:16px 18px;background:#F7F7F9;border:1px solid #ECECEE;border-radius:14px;">
          <div style="width:40px;height:40px;border-radius:50%;background:#FFFFFF;border:1px solid #E6E6E9;display:flex;align-items:center;justify-content:center;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#48484A" stroke-width="1.7"><circle cx="12" cy="12" r="8"/><line x1="12" y1="4" x2="12" y2="7"/><line x1="12" y1="17" x2="12" y2="20"/><line x1="4" y1="12" x2="7" y2="12"/><line x1="17" y1="12" x2="20" y2="12"/></svg>
          </div>
          <div style="font-size:15px;font-weight:600;">旋钮</div>
          <div style="flex:1;"></div>
          <div style="font-size:15px;color:#6E6E73;">导航</div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C4C4C7" stroke-width="2.2"><path d="M9 6l6 6-6 6"/></svg>
        </div>

        <!-- 语音键 (expanded) -->
        <div style="border:1.5px solid #0A84FF;border-radius:14px;overflow:hidden;box-shadow:0 4px 16px rgba(10,132,255,0.10);">
          <div style="display:flex;align-items:center;gap:14px;padding:16px 18px;background:#FFFFFF;">
            <div style="width:40px;height:40px;border-radius:50%;background:#EAF3FF;border:1px solid #CFE4FF;display:flex;align-items:center;justify-content:center;">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0A84FF" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
            </div>
            <div style="font-size:15px;font-weight:600;">语音键</div>
            <div style="flex:1;"></div>
            <div style="display:flex;gap:5px;">
              <span style="font-size:13px;font-weight:600;color:#0A84FF;background:#EAF3FF;border-radius:6px;padding:3px 8px;">⌘ G</span>
            </div>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0A84FF" stroke-width="2.2"><path d="M6 15l6-6 6 6"/></svg>
          </div>
          <div style="padding:4px 18px 18px;background:#FFFFFF;">
            <!-- waveform -->
            <div style="display:flex;align-items:center;gap:3px;height:44px;padding:0 2px 14px;">
              <!-- bars -->
              <div style="display:flex;align-items:center;gap:3px;height:30px;">
                <span style="width:3px;height:8px;background:#0A84FF;border-radius:2px;"></span><span style="width:3px;height:16px;background:#0A84FF;border-radius:2px;"></span><span style="width:3px;height:26px;background:#0A84FF;border-radius:2px;"></span><span style="width:3px;height:14px;background:#0A84FF;border-radius:2px;"></span><span style="width:3px;height:22px;background:#0A84FF;border-radius:2px;"></span><span style="width:3px;height:10px;background:#0A84FF;border-radius:2px;"></span><span style="width:3px;height:28px;background:#0A84FF;border-radius:2px;"></span><span style="width:3px;height:18px;background:#0A84FF;border-radius:2px;"></span><span style="width:3px;height:24px;background:#0A84FF;border-radius:2px;"></span><span style="width:3px;height:12px;background:#0A84FF;border-radius:2px;"></span><span style="width:3px;height:20px;background:#0A84FF;border-radius:2px;"></span><span style="width:3px;height:30px;background:#0A84FF;border-radius:2px;"></span><span style="width:3px;height:16px;background:#0A84FF;border-radius:2px;"></span><span style="width:3px;height:22px;background:#0A84FF;border-radius:2px;"></span><span style="width:3px;height:9px;background:#0A84FF;border-radius:2px;"></span><span style="width:3px;height:26px;background:#0A84FF;border-radius:2px;"></span>
              </div>
              <div style="flex:1;height:2px;background:repeating-linear-gradient(90deg,#C7C7CC 0,#C7C7CC 3px,transparent 3px,transparent 7px);margin-left:6px;"></div>
            </div>
            <div style="display:flex;align-items:center;gap:12px;">
              <div style="flex:1;display:flex;align-items:center;gap:10px;height:42px;padding:0 14px;background:#F2F2F4;border:1px solid #E5E5E8;border-radius:10px;font-size:14px;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6E6E73" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
                VibePal 麦克风
                <div style="flex:1;"></div>
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
              </div>
              <button style="height:42px;padding:0 22px;background:#0A84FF;border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;box-shadow:0 2px 6px rgba(10,132,255,0.28);">按住测试</button>
            </div>
          </div>
        </div>

        <!-- 确认键 -->
        <div class="vp-row" style="display:flex;align-items:center;gap:14px;padding:16px 18px;background:#F7F7F9;border:1px solid #ECECEE;border-radius:14px;">
          <div style="width:40px;height:40px;border-radius:50%;background:#FFFFFF;border:1px solid #E6E6E9;display:flex;align-items:center;justify-content:center;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#48484A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></svg>
          </div>
          <div style="font-size:15px;font-weight:600;">确认键</div>
          <div style="flex:1;"></div>
          <div style="font-size:15px;color:#6E6E73;">Return</div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C4C4C7" stroke-width="2.2"><path d="M9 6l6 6-6 6"/></svg>
        </div>

        <!-- 取消键 -->
        <div class="vp-row" style="display:flex;align-items:center;gap:14px;padding:16px 18px;background:#F7F7F9;border:1px solid #ECECEE;border-radius:14px;">
          <div style="width:40px;height:40px;border-radius:50%;background:#FFFFFF;border:1px solid #E6E6E9;display:flex;align-items:center;justify-content:center;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#48484A" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg>
          </div>
          <div style="font-size:15px;font-weight:600;">取消键</div>
          <div style="flex:1;"></div>
          <div style="font-size:15px;color:#6E6E73;">Esc</div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C4C4C7" stroke-width="2.2"><path d="M9 6l6 6-6 6"/></svg>
        </div>

      </div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
